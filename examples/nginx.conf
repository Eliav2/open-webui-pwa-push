# Web Push for an Open WebUI behind nginx (README.md): a complete server block.
# Open WebUI on 127.0.0.1:3000; change the host, port and server_name to yours.
# The service worker and push need https (or http://localhost): add your
# certificate (listen 443 ssl, ssl_certificate ...) for any other host.
#
# /srv/open-webui-push holds oc-sw.js and oc-push.js from web/, with the
# placeholders replaced (oc-push.js's two left as they are: push off, the
# service worker only). oc-push.js replaces Open WebUI's /static/loader.js,
# which is empty unless you put something there; if you did, append it to
# oc-push.js.
server {
    listen 80;
    server_name chat.example.com;

    # The two files. Exact matches: nginx picks them over "location /"
    # wherever they are in this block.
    location = /oc-sw.js {
        alias /srv/open-webui-push/oc-sw.js;
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /static/loader.js {
        alias /srv/open-webui-push/oc-push.js;
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }

    # Everything else is Open WebUI.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Its socket (/ws/socket.io) is a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replies stream: pass them on as they come.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;   # file uploads
    }
}
